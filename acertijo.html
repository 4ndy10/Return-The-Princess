<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acertijo — Prueba de Sabiduría | Return The Princess</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="acertijo">

    <div id="contenedor-3d"></div>

    <main class="pantalla acertijo">
        <img src="img/Doors_Layout.jpg" alt="Sala secreta del acertijo" class="img-fondo" id="img-fondo-acertijo">

        <h1>Prueba de Sabiduría</h1>

        <p data-typewriter="40" class="narrativa">
            El champiñón te ha transportado a una sala secreta. Una voz retumba entre las paredes: "Responde correctamente... o el veneno será tu destino."
        </p>

        <p class="pregunta-acertijo">¿De qué color es el champiñón que otorga una vida extra en el Reino Champiñón?</p>

        <div id="acertijo-opciones" class="opciones-champiñon">
            <div class="champiñon-card" data-respuesta="incorrecta" id="cham-rojo">
                <img src="img/ChamRojo.png" alt="Champiñón Rojo">
            </div>

            <div class="champiñon-card" data-respuesta="correcta" id="cham-verde">
                <img src="img/ChamVerde.png" alt="Champiñón Verde">
            </div>

            <div class="champiñon-card" data-respuesta="incorrecta" id="cham-azul">
                <img src="img/ChamAzul.png" alt="Champiñón Azul">
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
